name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "نوع البناء"
        type: choice
        options: [debug, release]
        default: debug
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # SDK موجود مسبقاً على ubuntu-latest، نكتفي بقبول التراخيص
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # فك ضغط المشروع تلقائياً وإيجاد مجلد gradlew
      - name: Unzip project and locate Gradle root
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            mkdir -p _project
            unzip -q -o "$ZIP" -d _project -x '__MACOSX/*'
            SEARCH=_project
          else
            echo "No zip found, using repository files"
            SEARCH=.
          fi
          GRADLEW=$(find "$SEARCH" -name gradlew -not -path '*/.git/*' | head -n1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found. تأكد أن الـ zip يحتوي مشروع Android كامل"
            exit 1
          fi
          PROJECT_DIR=$(cd "$(dirname "$GRADLEW")" && pwd)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          # إصلاح gradlew: علامات الاقتباس داخل DEFAULT_JVM_OPTS تُقرأ كاسم كلاس في Java
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          sed -i "s/^DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS='-Xmx64m -Xms64m'/" "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "Gradle project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # توقيع نسخة release (اختياري): يحتاج 4 secrets في GitHub
      # KEYSTORE_BASE64 , KEYSTORE_PASSWORD , KEY_ALIAS , KEY_PASSWORD
      - name: Sign release APK (if keystore secrets exist)
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secrets, APK will stay unsigned (لن يُثبَّت على الهاتف)"
            exit 0
          fi
          OUT="$PROJECT_DIR/app/build/outputs/apk/release"
          UNSIGNED=$(ls "$OUT"/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$OUT/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT/app-release-signed.apk" "$OUT/aligned.apk"
          rm -f "$OUT/aligned.apk" "$UNSIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.BUILD_TYPE }}-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

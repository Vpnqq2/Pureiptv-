name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          settings="$(find . -maxdepth 5 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.github-workspace/*' \
            -print -quit)"

          if [[ -z "$settings" ]]; then
            zip_file="$(find . -maxdepth 3 -type f \
              -iname '*.zip' -print -quit)"

            if [[ -z "$zip_file" ]]; then
              echo "::error::No Gradle project or ZIP found."
              exit 1
            fi

            mkdir -p .github-workspace/project
            unzip -q "$zip_file" -d .github-workspace/project

            settings="$(find .github-workspace/project \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print -quit)"
          fi

          if [[ -z "$settings" ]]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          project_dir="$(dirname "$settings")"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle and build APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"
          VERSION="$(sed -n \
            's/.*gradle-\([0-9][0-9.]*\)-bin.zip.*/\1/p' \
            "$PROJECT/gradle/wrapper/gradle-wrapper.properties" \
            | head -n 1)"

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine Gradle version."
            exit 1
          fi

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          cd "$PROJECT"
          /tmp/gradle-${VERSION}/bin/gradle \
            --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pureiptv-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

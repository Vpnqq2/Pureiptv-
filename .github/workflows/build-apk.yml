name: Build APK

on:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          mkdir -p project
          unzip -q -o "$ZIP" -d project

          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

          echo "Project directory: $ROOT"
          ls -la "$ROOT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew not found in project root."
            echo "Include the Gradle Wrapper in your ZIP."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/dev/null || true

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WALLIVERSE-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

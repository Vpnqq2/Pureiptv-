name: Build Pure IPTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Pure IPTV APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find . -maxdepth 5 -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path './.github-workspace/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname '*.zip' -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project or ZIP found."
              exit 1
            fi

            mkdir -p .github-workspace/project
            unzip -q "$ZIP_FILE" -d .github-workspace/project

            SETTINGS=$(find .github-workspace/project \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::The Android app module was not found."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -executable \
            -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

      - name: Determine Android SDK versions
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"

          COMPILE_SDK=$(grep -RhoE \
            'compileSdk(Version)?[[:space:]]*(=[[:space:]]*|[[:space:]]+)[0-9]+' \
            "$PROJECT" \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --exclude-dir=build \
            2>/dev/null \
            | grep -oE '[0-9]+' | head -n 1 || true)

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK=35
          fi

          echo "compile=$COMPILE_SDK" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${{ steps.sdk.outputs.compile }}" \
            "build-tools;35.0.0"

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"
          KEYSTORE="$PROJECT/debug.keystore"

          echo "Project directory: $PROJECT"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::Keystore creation failed."
            exit 1
          fi

          ls -l "$KEYSTORE"
          echo "Debug keystore is ready."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"
          cd "$PROJECT"

          echo "Building from: $(pwd)"
          echo "Checking debug keystore:"
          ls -l "$(pwd)/debug.keystore"

          if [ -f "./gradlew" ] && \
             [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then

            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug

          elif [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            VERSION=$(sed -n \
              's/.*gradle-\([0-9][0-9.]*\)-bin.zip.*/\1/p' \
              gradle/wrapper/gradle-wrapper.properties \
              | head -n 1)

            if [ -z "$VERSION" ]; then
              echo "::error::Could not determine Gradle version."
              exit 1
            fi

            curl -fL \
              "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp

            "/tmp/gradle-${VERSION}/bin/gradle" \
              --no-daemon --stacktrace assembleDebug

          else
            echo "::error::Gradle wrapper properties not found."
            exit 1
          fi

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated at $APK"
            find "$PROJECT/app/build/outputs" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK file is empty."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pureiptv-debug-apk
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

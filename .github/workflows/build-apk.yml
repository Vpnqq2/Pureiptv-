name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          # Supports either Gradle files at repository root or inside one ZIP/project folder.
          if [[ -f "./gradlew" || -f "./settings.gradle" || -f "./settings.gradle.kts" ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zip_file="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
          if [[ -n "$zip_file" ]]; then
            mkdir -p .github-workspace/project
            unzip -q "$zip_file" -d .github-workspace/project
          fi

          settings_file="$(find . -maxdepth 6 -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)"
          if [[ -z "$settings_file" ]]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts. Upload the ZIP to the repository or commit the extracted project files."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          set -euo pipefail
          project_dir="${{ steps.project.outputs.dir }}"
          if [[ -f "$project_dir/gradlew" ]]; then
            chmod +x "$project_dir/gradlew"
          else
            echo "::error::The project ZIP/repository does not contain gradlew. Add the Gradle Wrapper (gradlew, gradlew.bat, gradle/wrapper/*) to the project and rerun."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          project_dir="${{ steps.project.outputs.dir }}"
          cd "$project_dir"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

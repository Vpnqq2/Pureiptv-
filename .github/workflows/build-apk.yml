name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "نوع البناء"
        type: choice
        options:
          - debug
          - release
        default: debug

  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Extract a valid ZIP, or use project files directly.
      - name: Extract project and locate Android root
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _project
          SEARCH="."

          ZIP=""

          while IFS= read -r -d '' FILE; do
            if unzip -tq "$FILE" >/dev/null 2>&1; then
              ZIP="$FILE"
              break
            else
              echo "::warning::Skipping invalid ZIP: $FILE"
            fi
          done < <(
            find . -maxdepth 3 -type f -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './_project/*' \
              -print0
          )

          if [ -n "$ZIP" ]; then
            echo "Using ZIP: $ZIP"
            unzip -q -o "$ZIP" -d _project \
              -x '__MACOSX/*' '*/__MACOSX/*'
            SEARCH="_project"
          else
            echo "No valid ZIP found; checking repository files."
          fi

          SETTINGS=""

          while IFS= read -r -d '' FILE; do
            SETTINGS="$FILE"
            break
          done < <(
            find "$SEARCH" -type f \
              \( -name settings.gradle.kts \
                 -o -name settings.gradle \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -print0
          )

          if [ -z "$SETTINGS" ]; then
            echo "::error::Cannot find settings.gradle or settings.gradle.kts"
            echo "Check that the ZIP contains the complete Android project."
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS")" && pwd)"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::The Android app module was not found in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # Install the Gradle version specified by this project.
      # This does not require gradlew or gradle-wrapper.jar in the ZIP.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Gradle version:"
          gradle --version

          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-${{ env.BUILD_TYPE }}-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
